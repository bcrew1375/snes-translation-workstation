schema_version = 1
id = "dbz-kakusei-hen"
name = "Dragon Ball Z - Chou Gokuuden - Kakusei Hen"
platform = "snes"
adapter = "dbz_kakusei_hen.build"
source_directory = "src"

# Paths resolve relative to this project directory, so a project owns its own
# ROM and does not repeat its identifier in every path.
[input]
default_path = "rom/original.sfc"
size = 2097152
sha256 = "cc5ab583b5189c3f5b374335edf4b857461278d41ef674f7db31aa100dcb814a"

# Pin the deterministic translated output so later changes cannot silently
# alter the patch, custom glyphs, or checksum.
[output]
default_path = "build/dbz-kakusei-hen/translated.sfc"
size = 2097152
sha256 = "1091629245703d49d2b447ddde511559b84db12ba9847a44dfececb32890e73f"

[manifests]
analysis = "analysis/project.json"
patches = "translation/patches.tsv"
references = "translation/references.tsv"
ranges = "translation/ranges.tsv"
menu = "translation/menu.tsv"
name_entry = "translation/name_entry.tsv"

# The build executor independently computes the ROM diff and rejects every
# changed byte outside these inclusive ranges.
[[approved_ranges]]
name = "opening narration streams"
start = 0x0E1358
end = 0x0E1583

[[approved_ranges]]
name = "opening recap shared streams bank 99"
